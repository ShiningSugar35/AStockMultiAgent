schema_version: knowledge-skill-audit-policy-v1
expected_source_skill_count: 653
minimum_external_evidence_count: 2
default_direct_verdict: KEEP_SCOPED
default_visual_verdict: RETIRE
formal_committee_weight_allowed: false
paper_ledger_write_allowed: false
broker_execution_allowed: false
module_evidence:
  SOURCING_SCREENING: [RFS_MULTIPLE_TESTING_HLZ, RFS_REPLICATING_ANOMALIES_HXZ, CSRC_DISCLOSURE_RULES]
  FUNDAMENTAL_RESEARCH: [CSRC_DISCLOSURE_RULES, DAMODARAN_VALUATION_INTRO, CNINFO_DISCLOSURE_PLATFORM]
  VALUATION_PRICING: [DAMODARAN_VALUATION_INTRO, DAMODARAN_INTRINSIC_RELATIVE]
  PORTFOLIO_CONSTRUCTION: [NBER_PORTFOLIO_CONCENTRATION, NBER_UNDERDIVERSIFICATION_FIELD, RFS_TRADING_COSTS_NMV]
  POSITION_RISK_MANAGEMENT: [RFS_TRADING_COSTS_NMV, JF_BARBER_ODEAN_TRADING, NBER_MOMENTUM_CRASHES]
  PSYCHOLOGY_BEHAVIOR: [JF_BARBER_ODEAN_TRADING, NBER_UNDERDIVERSIFICATION_FIELD]
skill_evidence_routes:
  - route_id: ACCOUNTING_EPS
    keywords: [每股收益, EPS, 加权平均普通股, 稀释]
    evidence_ids: [MOF_CAS34_EPS, IFRS_IAS33_EPS]
  - route_id: ACCOUNTING_DEFERRED_TAX
    keywords: [递延所得税, 可抵扣暂时性差异, 所得税资产]
    evidence_ids: [MOF_CAS18_INCOME_TAX, IFRS_IAS12_INCOME_TAX]
  - route_id: ACCOUNTING_CONSOLIDATION
    keywords: [合并报表, 合并财务报表, 母公司报表]
    evidence_ids: [MOF_CAS33_CONSOLIDATED, CSRC_DISCLOSURE_RULES]
  - route_id: ACCOUNTING_DEBT_EQUITY
    keywords: [永续债, 优先股, 可转债, 金融负债, 权益工具]
    evidence_ids: [MOF_CAS37_FINANCIAL_INSTRUMENTS, IFRS_IAS32_PRESENTATION]
  - route_id: OFFICIAL_DISCLOSURE
    keywords: [公告, 年报, 法定披露, 巨潮, 交易所, 官方披露, 信息披露]
    evidence_ids: [CSRC_DISCLOSURE_RULES, CNINFO_DISCLOSURE_PLATFORM]
  - route_id: BACKTEST_MULTIPLE_TESTING
    keywords: [回测, 因子, 参数, 过拟合, 样本外, 前瞻, 多重检验, backtest, factor]
    evidence_ids: [RFS_MULTIPLE_TESTING_HLZ, RFS_REPLICATING_ANOMALIES_HXZ, QLIB_PIT]
  - route_id: MOMENTUM_REVERSAL
    keywords: [动量, 反转, 均线, 突破, 趋势, momentum, reversal]
    evidence_ids: [CHINA_A_ANOMALIES_JSZ, ROF_CHINA_MOMENTUM_REVERSAL, NBER_MOMENTUM_CRASHES]
  - route_id: TRADING_COST_CAPACITY
    keywords: [换手, 滑点, 冲击成本, 流动性, 容量, 交易成本, turnover, slippage, capacity]
    evidence_ids: [RFS_TRADING_COSTS_NMV, JF_BARBER_ODEAN_TRADING]
  - route_id: CONCENTRATION_DIVERSIFICATION
    keywords: [集中, 重仓, 分散, 组合, diversification, concentration]
    evidence_ids: [NBER_PORTFOLIO_CONCENTRATION, NBER_INFORMATION_UNDERDIVERSIFICATION, NBER_UNDERDIVERSIFICATION_FIELD]
  - route_id: VALUATION
    keywords: [估值, 内在价值, DCF, PE, PB, 现金流折现, valuation]
    evidence_ids: [DAMODARAN_VALUATION_INTRO, DAMODARAN_INTRINSIC_RELATIVE]
  - route_id: COMMODITY_CYCLE
    keywords: [周期, 库存, 产能, 供给, 供应, 需求, 商品, commodity, supply, demand]
    evidence_ids: [IMF_COMMODITY_ELASTICITY_2024, WORLDBANK_COMMODITY_OUTLOOK_2026]
  - route_id: EXECUTION_AUCTION
    keywords: [集合竞价, 撤单, 限价, 申报, 涨跌停, 成交规则]
    evidence_ids: [SSE_TRADING_RULES_2026, RFS_TRADING_COSTS_NMV]
visual_default:
  risk_codes: [HISTORICAL_CASE_NOT_GENERAL_METHOD, GENERALITY_FAILURE]
  evidence_ids: [RFS_MULTIPLE_TESTING_HLZ, RFS_REPLICATING_ANOMALIES_HXZ]
  rationale: Visual-derived source material remains immutable evidence, but a time-specific market call, company case, chart annotation, personal forecast, or direct trade instruction is not presumed to be a portable research method.
