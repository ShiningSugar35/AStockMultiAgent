replacement_templates:
  VALUATION_RANGE_UNCERTAINTY:
    skill_name: 估值以区间、敏感性和失效条件表达
    core_principle: 估值不是可被“确定”的单点事实；应把现金流、增长、风险、资本需求和折现假设写成区间与敏感性，并用新证据持续更新。
    evidence_ids: [DAMODARAN_VALUATION_INTRO, DAMODARAN_INTRINSIC_RELATIVE]
  FUNDAMENTAL_EXECUTION_ROLE:
    skill_name: 基本面定义投资命题，市场信号只承担可验证的执行角色
    core_principle: 企业基本面和估值决定中长期投资命题；技术或市场状态信号只有在目标周期、样本外和成本后被验证时，才可作为独立的执行或风险上下文，不能互相替代。
    evidence_ids: [CHINA_A_ANOMALIES_JSZ, RFS_MULTIPLE_TESTING_HLZ, DAMODARAN_VALUATION_INTRO]
  OOS_EVIDENCE_NOT_REALIZED_PNL:
    skill_name: 用独立样本外与前瞻证据验证方法，而非用单个账户结果证明真理
    core_principle: 单个账户、单次周期或幸存者案例不能证明一套投资理论；方法需要预先定义、独立样本外、前瞻记录、成本和尾部风险共同验证。
    evidence_ids: [RFS_MULTIPLE_TESTING_HLZ, RFS_REPLICATING_ANOMALIES_HXZ, QLIB_PIT]
  STOP_THESIS_RISK_SEPARATION:
    skill_name: 将命题失效、仓位风险和价格止损分开判断
    core_principle: 买入逻辑是否正确与账户能承受多大损失是两个问题；退出既可由命题失效触发，也可由预先定义的流动性、杠杆、集中度或风险预算触发，不能要求“先证明买错”才允许控险。
    evidence_ids: [RFS_TRADING_COSTS_NMV, NBER_MOMENTUM_CRASHES]
  TECHNICAL_HYPOTHESIS_VALIDATION:
    skill_name: 技术形态只作为可检验假设，不赋予任何单一指标普遍优先级
    core_principle: 支撑、压力、均线、突破、动量或反转都只能在明确周期、PIT数据、样本外和交易成本下验证；不存在未经检验即可宣称“唯一有效”的技术指标。
    evidence_ids: [CHINA_A_ANOMALIES_JSZ, ROF_CHINA_MOMENTUM_REVERSAL, RFS_MULTIPLE_TESTING_HLZ]
  CUMULATION_CONDITIONAL:
    skill_name: 用可验证的蓄积机制判断商业模式持续性
    core_principle: 历史客户、网络、资本、品牌或能力只有在存在可验证的保留率、再投资回报和转换机制时才支持未来价值；历史积累与未来收益不存在“必然正相关”。
    evidence_ids: [DAMODARAN_VALUATION_INTRO, CSRC_DISCLOSURE_RULES]
  SENTIMENT_REVIEW_NOT_SIGNAL:
    skill_name: 情绪极端是复核触发器，不是自动买卖信号
    core_principle: 恐惧、贪婪、拥挤或个人焦虑可以触发重新检查估值、流动性和命题，但不能单独决定买入、加仓、减仓或卖出。
    evidence_ids: [JF_BARBER_ODEAN_TRADING, NBER_UNDERDIVERSIFICATION_FIELD]
  PROBABILISTIC_NOT_CERTAIN:
    skill_name: 用概率、赔率和可证伪条件替代“投资必然性”
    core_principle: 投资结论应明确概率、情景、风险收益和失效条件；无法验证的“确定性”或“必然”不是投资优势，反而应提高证据门槛和降低仓位授权。
    evidence_ids: [RFS_MULTIPLE_TESTING_HLZ, DAMODARAN_VALUATION_INTRO]
  CYCLE_EVIDENCE_NOT_PRICE_LOW:
    skill_name: 周期低位必须由供需、成本、库存与估值共同证明
    core_principle: 价格跌得多或处于历史低位不能证明周期见底；需要同时验证供需弹性、库存/产能、边际成本、公司盈利传导和估值安全边际。
    evidence_ids: [IMF_COMMODITY_ELASTICITY_2024, WORLDBANK_COMMODITY_OUTLOOK_2026]
  NO_FIXED_RETURN_THRESHOLD:
    skill_name: 用命题和风险预算定义持有与退出，不用固定涨跌幅或翻倍目标
    core_principle: 10%到20%的波动、固定翻倍目标或固定收益年限不能跨标的通用；持有和退出应由投资命题、估值区间、流动性、组合风险和机会成本共同决定。
    evidence_ids: [DAMODARAN_VALUATION_INTRO, RFS_TRADING_COSTS_NMV]
  DIVERSIFICATION_CONCENTRATION_PREMISE:
    skill_name: 集中与分散取决于信息优势、共同暴露和损失承受力
    core_principle: 集中并非天然优于分散，分散也不是机械按证券数量；只有在信息优势可验证、共同风险暴露受控且尾部损失可承受时，才允许更高集中度。
    evidence_ids: [NBER_PORTFOLIO_CONCENTRATION, NBER_INFORMATION_UNDERDIVERSIFICATION, NBER_UNDERDIVERSIFICATION_FIELD]
  PRICE_CAUSE_CAUTION:
    skill_name: 不用短期价格事后反推唯一基本面原因
    core_principle: 短期价格可同时反映信息、流动性、风险偏好和噪声；除非有时间上可得的独立证据，不把涨跌自动归因为情绪、主力、政策或某个单一基本面事件。
    evidence_ids: [CHINA_A_ANOMALIES_JSZ, CSRC_DISCLOSURE_RULES]
  ACCOUNTING_CONSOLIDATED_SCOPE:
    skill_name: 集团分析优先合并报表，同时保留母公司报表的独立用途
    core_principle: 合并报表用于观察母公司及受控子公司形成的企业集团整体财务状况、经营成果和现金流量；母公司个别报表并非“没用”，仍可用于识别母公司层面的资产、负债、分配能力和对子公司的投资。
    evidence_ids: [MOF_CAS33_CONSOLIDATED, CSRC_DISCLOSURE_RULES]
  ACCOUNTING_EPS_WEIGHTED_AVERAGE:
    skill_name: 每股收益按准则口径使用加权平均普通股并单独处理稀释效应
    core_principle: 基本每股收益不能简单用净利润除以期末总股本替代；应使用归属于普通股股东的合适分子和发行在外普通股加权平均数，并按准则另行评估稀释性潜在普通股。
    evidence_ids: [MOF_CAS34_EPS, IFRS_IAS33_EPS]
  ACCOUNTING_DEBT_EQUITY_SUBSTANCE:
    skill_name: 金融负债与权益按合同义务和经济实质分类
    core_principle: 永续债、优先股、可转债等不能仅用名称或“要不要还本金”二分；应检查是否存在不可无条件避免的现金或其他金融资产交付义务、自身权益结算条款及合同经济实质。
    evidence_ids: [MOF_CAS37_FINANCIAL_INSTRUMENTS, IFRS_IAS32_PRESENTATION]
  ACCOUNTING_DEFERRED_TAX_TEMP_DIFF:
    skill_name: 递延所得税资产以可抵扣暂时性差异及可利用税务利益为核心
    core_principle: 递延所得税资产不是简单的“提前多交税”；它来自可抵扣暂时性差异以及符合确认条件的未使用税务亏损或税款抵减，并受未来可利用应纳税所得额等确认条件约束。
    evidence_ids: [MOF_CAS18_INCOME_TAX, IFRS_IAS12_INCOME_TAX]
  OFFICIAL_DISCLOSURE_PRIORITY:
    skill_name: 上市公司正式事实优先回到法定披露与交易所/监管来源
    core_principle: 年报、公告、重大事项与财务口径应优先使用法定披露平台、交易所、监管机构和发行人正式文件；二手平台和社交媒体只能用于定位或交叉线索。
    evidence_ids: [CSRC_DISCLOSURE_RULES, CNINFO_DISCLOSURE_PLATFORM]
  ANNUAL_REPORT_COMPARISON:
    skill_name: 年报分析同时做纵向趋势、横向可比与异常科目复核
    core_principle: 单年单公司的绝对数字不足以定义“好坏”；应先统一会计口径，再比较多期趋势、同业可比指标和异常变动科目，并回到附注与业务驱动解释差异。
    evidence_ids: [CSRC_DISCLOSURE_RULES, IFRS_IAS7_CASHFLOW]
