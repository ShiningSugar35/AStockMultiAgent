config_version: market-reference-v2
retry:
  max_attempts: 1
  backoff_seconds: 0.25
identity_search_max_pages: 50
minimum_instrument_records:
  XSHG: 1500
  XSHE: 2000
  BJSE: 150
routes:
  instrument.master:
    - {provider_id: bse-official-reference, operation: bse-official-master, markets: [BJSE]}
    - {provider_id: baostock-reference, operation: baostock-master}
    - {provider_id: eastmoney-reference, operation: eastmoney-master}
    - {provider_id: sina-reference, operation: sina-master}
  instrument.identity:
    - {provider_id: bse-official-reference, operation: bse-official-exact, markets: [BJSE]}
    - {provider_id: baostock-reference, operation: baostock-identity}
    - {provider_id: eastmoney-reference, operation: eastmoney-exact}
    - {provider_id: sina-reference, operation: sina-exact}
    - {provider_id: eastmoney-reference, operation: eastmoney-paginated-master}
  market.calendar:
    - {provider_id: baostock-reference, operation: baostock-calendar}
  market.daily_unadjusted:
    - {provider_id: baostock-reference, operation: baostock-daily}
    - {provider_id: eastmoney-reference, operation: eastmoney-daily}
    - {provider_id: sina-reference, operation: sina-daily}
  corporate_actions.structured_hint:
    - {provider_id: baostock-reference, operation: baostock-corporate-hint}
  corporate_actions.official_evidence:
    - {provider_id: cninfo-disclosures, operation: cninfo-official}
macro_authority_routes:
  macro.statistical_release:
    - {provider_id: nbs-statistical-release, operation: nbs-indicator}
  macro.monetary_policy_release:
    - {provider_id: pboc-monetary-policy-release, operation: pboc-indicator}
  macro.fiscal_policy_release:
    - {provider_id: mof-fiscal-policy-release, operation: mof-indicator}
  macro.pricing_policy_release:
    - {provider_id: ndrc-pricing-policy-release, operation: ndrc-indicator}
official_market_coverage:
  corporate_actions.official_evidence:
    XSHG: AVAILABLE
    XSHE: AVAILABLE
    BJSE: AVAILABLE
  financial.official_report:
    XSHG: AVAILABLE
    XSHE: AVAILABLE
    BJSE: AVAILABLE
  instrument.master:
    XSHG: UNAVAILABLE
    XSHE: UNAVAILABLE
    BJSE: AVAILABLE
daily_adjustment_mode: NONE
daily_timestamp_semantics: SHANGHAI_SESSION_CLOSE
volume_unit: SHARE
amount_unit: CNY
markets: [XSHG, XSHE, BJSE, INDEX]
automatic_ledger_write: false
