schema_version: presentation-policy-v1
locale: zh-CN
default_mode: INVESTOR
reader_profile: beginner_no_economics_industry_or_policy_background
safe_fallback_text: "当前研究报告尚有内容需要核实或修订，暂时无法可靠呈现投资判断。"
# Only investment facts reach public prose. Workflow and delivery receipts stay internal.
public_internal_process_patterns:
  - '(?i)(?:report_id|DeliveryLedger|SourceSnapshot|Publication Gate|FinancialSourceRelease)'
  - '(?i)\breport_id\b|\bDeliveryLedger\b|\bSourceSnapshot\b|\bPublication Gate\b'
  - '(?:QQ投递|正式推荐收据|认证及研究收据|官方公告索引)'
  - '(?:本轮|本次)(?:机器|本地|系统)(?:状态|核验|读取)'
  - '(?:项目正式|内部)(?:官方|认证|入库)'
  - '(?:未生成|不生成|不下|未下)(?:实际|模拟|真实|任何)?(?:订单|持仓收益)'
prose_style_patterns:
  - '(?:不是|并非|不只是|不仅仅是)[^。！？\n]{1,100}[，,；;][^。！？\n]{0,8}而是'
  - '[，,；;]\s*而不是[^。！？\n]{1,100}'
  - '让我们(?:深入|一探|一起走进)|这才是真正的|不妨让我们'
term_explanations:
  CVaR: 极端不利情形下的平均损失
  DCF: 将未来现金流折算成今天的价值
  夏普比率: 每承担一份波动风险获得的超额收益
  久期: 债券价格对利率变化的敏感程度
  风险平价: 按风险贡献分配仓位的方法
  盈利修正: 对未来利润预期的上调或下调
  尾部风险: 低概率但损失可能很大的风险
  市盈率: 股价相当于公司每股利润的多少倍
  市净率: 股价相当于每股净资产的多少倍
  ROE: 公司用股东投入资本创造利润的效率
  毛利率: 营业收入扣除直接成本后剩余的比例
  经营现金流: 公司日常经营真正流入和流出的现金
  自由现金流: 经营产生的现金扣除维持业务所需投资后的余额
  估值分位: 当前估值在一段历史估值区间中的相对位置
max_bullets: 8
max_heading_level: 2
semantic_duplicate_threshold: 0.92
english_density_threshold: 0.25
diagnostic_intent_terms:
  - 调试
  - 排查系统
  - 系统排查
  - 看日志
  - 查看日志
  - 系统日志
  - 状态码
  - 错误码
  - 工件
  - artifact
  - 数据库
  - sqlite
  - provider
  - 接口错误
  - traceback
  - stack trace
  - 堆栈
  - cli
  - schema
  - migration
  - 哈希
  - hash
  - sql
  - 测试失败
  - 单元测试
  - 集成测试
diagnostic_negation_terms:
  - 不要看日志
  - 不用看日志
  - 无需看日志
  - 不需要调试
  - 不用调试
  - 无需调试
  - 不要调试
  - 别进入开发者模式
  - 不要进入开发者模式
  - 不用进入开发者模式
  - 无需进入开发者模式
  - 不是让你调试
forbidden_expressions:
  - 综上所述
  - 值得注意的是
  - 需要强调的是
  - 毋庸置疑
  - 从某种意义上说
  - 不难发现
  - 可以看出
  - 作为一个 AI
  - 以下是为您
  - 赋能
  - 抓手
  - 全方位
  - 多维度
  - 深度挖掘
protected_terms:
  - A股
  - ETF
  - ROE
  - DCF
  - CVaR
  - T+1
  - Alpha
  - Beta
budgets:
  FACT_QUERY: {min_chars: 40, max_chars: 180, max_reasons: 2}
  MARKET_STATUS: {min_chars: 80, max_chars: 300, max_reasons: 3}
  COMPANY_QUICK_VIEW: {min_chars: 120, max_chars: 600, max_reasons: 4}
  FULL_RESEARCH_RECOMMENDATION: {min_chars: 800, max_chars: 8000, max_reasons: 16}
  DEEP_RESEARCH: {min_chars: 500, max_chars: 4000, max_reasons: 8}
  DEVELOPER_DIAGNOSTIC: {min_chars: 80, max_chars: 800, max_reasons: 4}
  FORMAL_REPORT: {min_chars: 800, max_chars: 8000, max_reasons: 8}
