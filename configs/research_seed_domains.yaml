  - board_contains: ["军工", "国防"]
    skill_terms: ["军工", "国防军工"]
  - board_contains: ["白酒"]
    skill_terms: ["白酒"]
  - board_contains: ["银行"]
    skill_terms: ["银行"]
  - board_contains: ["保险"]
    skill_terms: ["保险"]
  - board_contains: ["煤炭"]
    skill_terms: ["煤炭"]
  - board_contains: ["有色"]
    skill_terms: ["有色", "有色金属"]
  - board_contains: ["化工"]
    skill_terms: ["化工"]
