# Current account profile is user-reported; endpoint permission requires a real response.
schema_version: tushare-access-v1
source_id: tushare
reported_points: 2120
global_requests_per_minute: 200
default_endpoint_requests_per_day: 100000
financial_requests_per_minute: 80
financial_quota_basis: USER_REQUEST
max_concurrency: 2
timeout_seconds: 20
max_response_bytes: 4194304
# This is a conservative project-wide envelope, not a claim of 200 concurrent calls.
# HTTP and controlled MCP calls must reserve against this same source identity.
documentation:
  reviewed_at: '2026-11-21'
  tier: 'https://tushare.pro/document/1?doc_id=290'
  permissions: 'https://tushare.pro/document/1?doc_id=108'
