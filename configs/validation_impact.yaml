version: validation-impact-v1
# Risk controls determine WHAT must be tested; impact determines HOW MUCH.
full_suite_paths:
  - migrations/*
  - src/astock/core/state.py
  - src/astock/core/object_store.py
  - src/astock/core/hashing.py
  - src/astock/schemas/base.py
  - src/astock/settings.py
  - pyproject.toml
  - uv.lock
  - tests/conftest.py
rules:
  # Existing uncommitted collector retirement is integrated with its surviving local consumers.
  - name: local-knowledge-and-retired-collectors
    changed:
      - src/astock/knowledge/*
      - configs/knowledge_sources.yaml
      - configs/knowledge_semantic_prompt.md
      - configs/manual_investigation_tasks.yaml
      - configs/zhihu_endpoint_templates.yaml
      - tests/fixtures/knowledge/zhihu_*
      - tests/integration/test_knowledge_collection.py
      - tests/integration/test_knowledge_comments.py
      - tests/integration/test_zhihu_*
      - tasks/*
    tests:
      - tests/integration/test_community_collector_retirement.py
      - tests/integration/test_knowledge*.py
      - tests/integration/test_direct_source_distillation.py
      - tests/integration/test_private_*_ingest.py
      - tests/unit/test_knowledge*.py
      - tests/unit/test_direct_source*.py
      - tests/unit/test_phase2_scope_configs.py
      - tests/unit/test_zhihu_visual_pipeline.py
      - tests/unit/test_repo_skills.py
  - name: scheduled-session-brief-reuse
    changed: [src/astock/investor_orchestration/scheduled.py]
    tests:
      - tests/unit/test_session_brief.py
      - tests/unit/test_scheduled*.py
      - tests/integration/test_scheduled*.py
      - tests/unit/test_continuous_monitoring.py
      - tests/integration/test_research_quality_cli.py
  - name: current-adaptation-provenance
    changed: [third_party/audits/serenity/local-adaptation-release-v2.json]
    tests:
      - tests/unit/test_open_source_audits.py
      - tests/integration/test_cli.py
      - tests/integration/test_research_core.py
      - tests/integration/test_research_diagnostics.py
  - name: owned-process-lifecycle
    changed: [scripts/run_local_quality.py, src/astock/research/process_worker.py, src/astock/research/__init__.py]
    tests:
      - tests/unit/test_research_process_worker.py
      - tests/unit/test_research_worker_cancellation.py
      - tests/unit/test_quality_runner_processes.py
      - tests/unit/test_quality_runner_fingerprint.py
      - tests/unit/test_research_package_imports.py
      - tests/unit/test_validation_planning.py
  - name: storage-retention-safety
    changed: [src/astock/storage_retention.py, configs/storage_lifecycle.yaml]
    tests:
      - tests/unit/test_storage_lifecycle.py
      - tests/unit/test_storage_retention.py
      - tests/unit/test_quality_runner_processes.py
  - name: host-first-web-tools
    changed: [src/astock/research/web_tool*.py, src/astock/providers/deepseek_tools.py, src/astock/schemas/web_tools.py, configs/web_tools.yaml]
    tests:
      - tests/unit/test_web_tools.py
      - tests/unit/test_web_discovery.py
      - tests/unit/test_source_policy_gate.py
      - tests/unit/test_current_research_productization.py
      - tests/integration/test_cli.py
  - name: intraday-fallback
    changed: [src/astock/providers/mootdx_fallback.py, integrations/mootdx/*, configs/mootdx_fallback.yaml, src/astock/market_data/sync.py, src/astock/investor_orchestration/scheduled_preparation.py, src/astock/monitoring/service.py, tests/fixtures/providers/mootdx*]
    tests:
      - tests/unit/test_mootdx_fallback.py
      - tests/contract/test_provider_probe_contract.py
      - tests/integration/test_market_sync.py
      - tests/unit/test_scheduled_preparation.py
      - tests/unit/test_continuous_monitoring.py
      - tests/unit/test_source_router.py
      - tests/unit/test_provider_registry.py
      - tests/integration/test_scheduled_input_coverage.py
      - tests/integration/test_scheduled_semantic_coverage.py
  - name: tushare-structured-access
    changed: [src/astock/providers/tushare_*.py, integrations/tushare/*, configs/tushare_access.yaml, tests/fixtures/providers/tushare-*]
    tests:
      - tests/unit/test_tushare_structured.py
      - tests/contract/test_provider_probe_contract.py
      - tests/unit/test_source_router.py
      - tests/unit/test_provider_registry.py
      - tests/unit/test_provider_supplemental.py
  - name: portfolio-numeric-invariants
    changed: [src/astock/portfolio/analytics.py]
    tests:
      - tests/unit/test_portfolio_analysis.py
      - tests/unit/test_portfolio_numeric_invariants.py
      - tests/unit/test_portfolio_decision.py
      - tests/unit/test_portfolio_total_return.py
      - tests/unit/test_phase10_portfolio_vnext.py
      - tests/integration/test_portfolio*.py
  - name: documentation-contracts
    changed: ['*.md', 'docs/*', '.agents/*', 'planning/*', '.gitignore']
    tests:
      - tests/unit/test_document_governance.py
      - tests/unit/test_workflow_docs.py
      - tests/unit/test_repo_skills.py
      - tests/unit/test_company_research_continuation_docs.py
  - name: bounded-current-recovery
    changed:
      - src/astock/research/continuation*
      - src/astock/schemas/research_continuation.py
      - src/astock/research/acquisition.py
    tests:
      - tests/unit/test_current_research*.py
      - tests/unit/test_adaptive_recovery_wp27.py
      - tests/unit/test_research_team.py
  - name: investment-closure
    changed: [src/astock/investor_orchestration/closure.py]
    tests:
      - tests/unit/test_investment_request_closure.py
      - tests/unit/test_investor_orchestration.py
  - name: public-report-style
    changed: [src/astock/research/report_style.py]
    tests:
      - tests/unit/test_presentation_gateway.py
      - tests/unit/test_presentation_humanize_experiment.py
  - name: source-routing-and-adapters
    changed:
      - src/astock/providers/*
      - src/astock/core/source_*.py
      - src/astock/core/credentials.py
      - .env.example
      - src/astock/market_data/reference*.py
      - src/astock/schemas/provider.py
      - configs/provider*.yaml
      - configs/source*.yaml
      - configs/market_reference.yaml
      - configs/transport_profiles.yaml
    tests:
      - tests/unit/test_provider_*.py
      - tests/unit/test_source_*.py
      - tests/unit/test_reference_data_schemas.py
      - tests/integration/test_market_reference.py
      - tests/integration/test_provider_probe.py
  - name: financial-domain
    changed:
      - src/astock/financial_sources/*
      - src/astock/financial_integrity/*
      - src/astock/schemas/financial*.py
      - configs/financial*.yaml
    tests:
      - tests/unit/test_financial*.py
      - tests/unit/test_candidate_financial_policy.py
      - tests/unit/test_full_research_source_binding.py
      - tests/integration/test_financial*.py
  - name: candidate-discovery-and-promotion
    changed:
      - src/astock/candidates/*
      - src/astock/schemas/research_seeds.py
      - src/astock/schemas/candidates.py
      - src/astock/schemas/candidate_promotion.py
      - src/astock/research/team.py
      - configs/research_team.yaml
    tests:
      - tests/unit/test_research_seeds.py
      - tests/unit/test_candidate_scan.py
      - tests/unit/test_candidate_promotion.py
      - tests/unit/test_candidate_*policy.py
      - tests/unit/test_research_team.py
  - name: news-discovery-and-monitoring
    changed:
      - src/astock/monitoring/news.py
    tests:
      - tests/unit/test_news_capture_scope.py
      - tests/unit/test_continuous_monitoring.py
      - tests/unit/test_external_capabilities.py
      - tests/unit/test_scheduled_preparation.py
      - tests/integration/test_scheduled_input_coverage.py
      - tests/integration/test_scheduled_semantic_coverage.py
  - name: investor-publication-and-language
    changed:
      - src/astock/investor_orchestration/gateway.py
      - src/astock/investor_orchestration/answer_projection.py
      - src/astock/investor_orchestration/full_research.py
    tests:
      - tests/unit/test_full_research_recommendation.py
      - tests/unit/test_investor_answer_*.py
      - tests/unit/test_investor_orchestration_guards.py
      - tests/unit/test_public_capital_privacy.py
      - tests/unit/test_wp25_shareable_acceptance.py
  - name: scheduled-watch-and-storage-lifecycle
    changed:
      - configs/chat_invocation_policy_v1.yaml
      - src/astock/investor_orchestration/host_continuation.py
      - src/astock/investor_orchestration/watch_campaign.py
      - src/astock/operations.py
    tests:
      - tests/unit/test_host_continuation_policy.py
      - tests/unit/test_watch_campaign.py
      - tests/unit/test_scheduled_run_ownership.py
      - tests/unit/test_investor_subject_projection.py
      - tests/unit/test_continuous_monitoring.py
      - tests/unit/test_storage_lifecycle.py
      - tests/unit/test_original_instruction_contract.py
  # WP62-66: explicit high-signal regression map; unknown shared paths still escalate.
  - name: company-research-typed-market-context
    changed: [src/astock/schemas/research_team.py, src/astock/research/team.py]
    tests:
      - tests/unit/test_research_team.py
      - tests/unit/test_technical_research_team.py
      - tests/unit/test_current_research_continuation.py
      - tests/unit/test_investor_domain_contracts.py
      - tests/unit/test_full_research_source_binding.py
      - tests/integration/test_technical_registered.py
  - name: technical-research-and-reference
    changed: [src/astock/technical/*, src/astock/schemas/technical.py, configs/technical_analysis.yaml, src/astock/investor_orchestration/regime_reference_views.py]
    tests:
      - tests/unit/test_technical_analysis.py
      - tests/unit/test_technical_research_team.py
      - tests/integration/test_technical_registered.py
      - tests/unit/test_entry_quality.py
      - tests/integration/test_regime_reference_views.py
      - tests/integration/test_market_reference.py
      - tests/unit/test_reference_data_schemas.py
  - name: bounded-strategy-experiment-and-atomic-selection
    changed: [src/astock/experiments/*, configs/strategy_validation.yaml]
    tests:
      - tests/unit/test_strategy_validation.py
      - tests/unit/test_selection_seal.py
      - tests/integration/test_strategy_validation_cli.py
      - tests/integration/test_shadow_evaluation.py
      - tests/integration/test_paper_replay.py
      - tests/unit/test_validation_planning.py
  - name: bounded-research-quality-and-investor-brief
    changed: [src/astock/research/debate_evaluation.py, src/astock/research/outcome_feedback.py, src/astock/research/session_brief.py, src/astock/research/quality_cli.py, configs/research_quality.yaml]
    tests:
      - tests/unit/test_debate_evaluation.py
      - tests/unit/test_outcome_feedback.py
      - tests/unit/test_session_brief.py
      - tests/integration/test_research_quality_cli.py
      - tests/unit/test_quality_followup.py
      - tests/unit/test_quality_review_regressions.py
      - tests/unit/test_price_comparability.py
      - tests/unit/test_full_research_recommendation.py
  - name: official-web-discovery-lead
    changed: [src/astock/research/web_discovery.py, src/astock/web_discovery_cli.py, src/astock/schemas/web_discovery.py, configs/web_discovery_lead.yaml]
    tests:
      - tests/unit/test_web_discovery.py
      - tests/unit/test_source_policy_gate.py
      - tests/unit/test_provider_supplemental.py
      - tests/unit/test_open_source_audits.py
      - tests/unit/test_current_research_productization.py
      - tests/unit/test_original_instruction_contract.py
      - tests/integration/test_cli.py
      - tests/unit/test_validation_planning.py
      - tests/unit/test_document_governance.py
  - name: validation-tooling
    changed:
      - scripts/plan_validation.py
      - scripts/audit_gate_inventory.py
      - scripts/run_local_quality.py
      - configs/validation_impact.yaml
    tests:
      - tests/unit/test_validation_planning.py
      - tests/unit/test_document_governance.py
      - tests/unit/test_workflow_docs.py
  - name: changed-tests
    changed: ['tests/*']
    tests: [tests/unit/test_validation_planning.py]
  - name: supplemental-cli-wiring
    changed: [src/astock/cli.py, src/astock/research/continuation_cli.py]
    tests:
      - tests/unit/test_provider_supplemental.py
      - tests/unit/test_investor_orchestration.py
      - tests/unit/test_open_source_audits.py
      - tests/unit/test_current_research_productization.py
  - name: optional-source-contracts
    changed:
      - src/astock/providers/supplemental*.py
      - tests/fixtures/providers/*-hints-success.json
    tests: [tests/unit/test_provider_supplemental.py]
