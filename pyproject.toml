[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "astock-research"
version = "0.4.1"
description = "Deterministic A-share research, evidence, and paper-trading foundation for Codex"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "AStockMultiAgent contributors" }]
dependencies = [
  "baostock==0.8.9",
  "cryptography>=49.0.0,<50",
  "httpx>=0.28.1,<1",
  "pdfplumber>=0.11.10,<0.12",
  "pyarrow>=25.0.0,<26",
  "pydantic>=2.12.0,<3",
  "pymupdf>=1.28.0,<1.29",
  "pyod>=3.6.1,<3.7",
  "python-docx>=1.2.0,<2",
  "pyyaml>=6.0.3,<7",
  "rapidocr-onnxruntime>=1.4.4,<2",
  "scikit-learn>=1.9.0,<1.10",
  "typer>=0.21.0,<1",
  "tzdata>=2025.2,<2027",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=5.1.0,<6",
]

[project.scripts]
astock = "astock.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.150.0,<7",
  "import-linter>=2.17,<3",
  "pyright>=1.1.408,<2",
  "pytest>=9.0.0,<10",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.14.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astock"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "acceptance: expensive local real-OCR acceptance benchmarks",
  "live: low-frequency tests that call external providers",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = ["runtime", ".venv"]

[tool.importlinter]
root_package = "astock"

[[tool.importlinter.contracts]]
name = "Core and schemas stay below business services"
type = "forbidden"
source_modules = ["astock.core", "astock.schemas"]
forbidden_modules = [
  "astock.providers", "astock.research", "astock.portfolio",
  "astock.paper_trading", "astock.investor_orchestration", "astock.reports",
]

[[tool.importlinter.contracts]]
name = "Providers cannot orchestrate research or write portfolios"
type = "forbidden"
source_modules = ["astock.providers"]
forbidden_modules = [
  "astock.research", "astock.portfolio", "astock.paper_trading",
  "astock.investor_orchestration",
]
allow_indirect_imports = true
# Fixed subprocess adapters reuse the one owned launcher; no business research calls.
ignore_imports = [
  "astock.providers.mootdx_fallback -> astock.research.process_worker",
  "astock.providers.supplemental -> astock.research.process_worker",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Research has no new account or execution dependencies"
type = "forbidden"
source_modules = ["astock.research"]
forbidden_modules = ["astock.paper_trading", "astock.external_accounts"]
allow_indirect_imports = true
# Existing read-only readiness/market-rule/verification consumers, audited by name.
ignore_imports = [
  "astock.research.runtime_readiness -> astock.paper_trading.ledger",
  "astock.research.runtime -> astock.paper_trading.operation",
  "astock.research.trade_view -> astock.paper_trading.operation",
  "astock.research.trading_classification -> astock.paper_trading.operation",
]
unmatched_ignore_imports_alerting = "error"
